name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: segredo-usado-somente-no-ci-com-mais-de-32-caracteres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Dependências de produção com vulnerabilidade conhecida derrubam o CI.
      - run: uv export --no-dev --frozen --no-hashes --no-emit-project > /tmp/requisitos.txt
      - run: uv run pip-audit -r /tmp/requisitos.txt --no-deps --disable-pip
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
      - run: docker build -t educamobile-api .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Só dependências que vão para produção; as de desenvolvimento ficam por conta do Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build
      - run: docker build -t educamobile-web .
