<!doctype html>
<!-- Tela de teste do backend, não é o frontend oficial. Para abrir: cd dev-ui && python -m http.server 5500 -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>EducaMobile dev-ui</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <form id="login">
    <label>API <input id="api" value="http://localhost:8000"></label>
    <label>E-mail <input id="email" type="email" required autocomplete="username"></label>
    <label>Senha <input id="senha" type="password" required autocomplete="current-password"></label>
    <button>Entrar e carregar</button>
  </form>
  <p id="status" role="status"></p>
  <div id="mapa" style="height: 80vh"></div>
  <script>
    const mapa = L.map('mapa').setView([-25.43, -49.27], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
    }).addTo(mapa);
    const camada = L.featureGroup().addTo(mapa);
    const status = document.getElementById('status');
    const cores = ['red', 'blue', 'green', 'purple', 'orange'];

    // bindPopup interpreta HTML; o nome vem da API, então entra como texto.
    const popup = (texto) => {
      const el = document.createElement('span');
      el.textContent = texto;
      return el;
    };

    async function pedir(caminho, opcoes) {
      const api = document.getElementById('api').value;
      const resposta = await fetch(api + caminho, opcoes);
      if (!resposta.ok) throw new Error(`${caminho}: HTTP ${resposta.status}`);
      return resposta.json();
    }

    document.getElementById('login').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      status.textContent = 'Carregando...';
      try {
        const { access_token: token } = await pedir('/auth/login', {
          method: 'POST',
          body: new URLSearchParams({
            username: document.getElementById('email').value,
            password: document.getElementById('senha').value,
          }),
        });
        const headers = { Authorization: `Bearer ${token}` };
        const [paradas, rotas] = await Promise.all([
          pedir('/paradas?limit=500', { headers }),
          pedir('/rotas?limit=200', { headers }),
        ]);
        camada.clearLayers();
        for (const p of paradas) {
          L.marker([p.localizacao.latitude, p.localizacao.longitude])
            .bindPopup(popup(p.nome)).addTo(camada);
        }
        rotas.forEach((r, i) => {
          if (!r.trajeto) return;
          const pontos = r.trajeto.coordinates.map(([lon, lat]) => [lat, lon]);
          L.polyline(pontos, { color: cores[i % cores.length] })
            .bindPopup(popup(`${r.nome}: ${Math.round(r.distancia_m)} m`)).addTo(camada);
        });
        if (camada.getLayers().length) mapa.fitBounds(camada.getBounds());
        status.textContent = `${paradas.length} paradas, ${rotas.length} rotas`;
      } catch (erro) {
        status.textContent = `Erro: ${erro.message}`;
      }
    });
  </script>
</body>
</html>
